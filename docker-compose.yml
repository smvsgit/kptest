# Karyalay Portal (SMVS Storage) — fresh Coolify production compose
#
# Intended lifecycle:
#   - Create a NEW Coolify application/resource from Git main.
#   - New resource gets new named app-storage/db-data volumes => fresh DB.
#   - Normal redeploy of the SAME resource preserves those volumes and data.
#   - No destructive database reset or legacy SQL restore exists in this repository.
#   - Coolify auto-generates independent 64-character Super Admin / DB / DB-root passwords.
#
# Storage policy:
#   - DB data: named Docker volume on Docker data-root.
#   - Laravel framework state: named Docker volume.
#   - Large user media: /srv/media/projects/karyalayportal/uploads bind mount.
#   - No host HTTP port is published; Coolify/Traefik is the only public ingress.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Karyalay Portal}"
      APP_ENV: production
      APP_DEBUG: "false"
      # Optional. If blank/unset, entrypoint generates it once into app-storage.
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-https://karyalay-portal.divyajivan.com}"

      # New Coolify resources can assign Traefik a different Docker IP.
      # Because this app exposes no host port, trust the ingress proxy dynamically.
      # Override with a comma-separated IP/CIDR list only if you intentionally need it.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-*}"

      # Production is HTTPS-only through Traefik.
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"

      # Fresh-install Super Admin. No credentials are committed to Git.
      SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-Super Admin}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?}"
      # Coolify auto-generates this 64-character secret and keeps it stable for this resource.
      SUPER_ADMIN_PASSWORD: "${SERVICE_PASSWORD_64_SUPERADMIN}"
      SUPER_ADMIN_PHONE: "${SUPER_ADMIN_PHONE:-}"

      TZ: "${TZ:-Asia/Kolkata}"
      LOG_CHANNEL: stack
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-karyalay}"
      DB_USERNAME: "${DB_USERNAME:-karyalay}"
      # Coolify auto-generates this 64-character DB user password.
      DB_PASSWORD: "${SERVICE_PASSWORD_64_DATABASE}"

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: "${MEILISEARCH_KEY:-${SERVICE_PASSWORD_64_MEILI}}"
      MEILISEARCH_INDEX: "${MEILISEARCH_INDEX:-karyalay_media_files}"
      FILESYSTEM_DISK: media
      MEDIA_UPLOAD_HOST_PATH: "/srv/media/projects/karyalayportal/uploads"
      MEDIA_UPLOAD_CONTAINER_PATH: "/var/www/html/storage/app/media/uploads"
    expose:
      - "80"
    volumes:
      - app-storage:/var/www/html/storage
      - /srv/media/projects/karyalayportal/uploads:/var/www/html/storage/app/media/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started

  meilisearch:
    exclude_from_hc: true
    image: getmeili/meilisearch:v1.53.1
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: "${MEILISEARCH_KEY:-${SERVICE_PASSWORD_64_MEILI}}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

  worker:
    exclude_from_hc: true
    healthcheck:
      disable: true
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        if [ -z "$${APP_KEY:-}" ]; then
          until [ -s /var/www/html/storage/app/.runtime-app-key ]; do sleep 2; done
          export APP_KEY="$$(cat /var/www/html/storage/app/.runtime-app-key)"
        fi
        exec php artisan queue:work --sleep=2 --tries=3 --timeout=900
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-https://karyalay-portal.divyajivan.com}"
      TZ: "${TZ:-Asia/Kolkata}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-karyalay}"
      DB_USERNAME: "${DB_USERNAME:-karyalay}"
      DB_PASSWORD: "${SERVICE_PASSWORD_64_DATABASE}"
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: media
      MEDIA_UPLOAD_HOST_PATH: "/srv/media/projects/karyalayportal/uploads"
      MEDIA_UPLOAD_CONTAINER_PATH: "/var/www/html/storage/app/media/uploads"
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: "${MEILISEARCH_KEY:-${SERVICE_PASSWORD_64_MEILI}}"
      MEILISEARCH_INDEX: "${MEILISEARCH_INDEX:-karyalay_media_files}"
    volumes:
      - app-storage:/var/www/html/storage
      - /srv/media/projects/karyalayportal/uploads:/var/www/html/storage/app/media/uploads
    depends_on:
      app:
        condition: service_healthy
      meilisearch:
        condition: service_started


  scheduler:
    exclude_from_hc: true
    healthcheck:
      disable: true
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        if [ -z "$${APP_KEY:-}" ]; then
          until [ -s /var/www/html/storage/app/.runtime-app-key ]; do sleep 2; done
          export APP_KEY="$$(cat /var/www/html/storage/app/.runtime-app-key)"
        fi
        exec php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-https://karyalay-portal.divyajivan.com}"
      TZ: "${TZ:-Asia/Kolkata}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-karyalay}"
      DB_USERNAME: "${DB_USERNAME:-karyalay}"
      DB_PASSWORD: "${SERVICE_PASSWORD_64_DATABASE}"
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: media
      MEDIA_UPLOAD_HOST_PATH: "/srv/media/projects/karyalayportal/uploads"
      MEDIA_UPLOAD_CONTAINER_PATH: "/var/www/html/storage/app/media/uploads"
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: "${MEILISEARCH_KEY:-${SERVICE_PASSWORD_64_MEILI}}"
      MEILISEARCH_INDEX: "${MEILISEARCH_INDEX:-karyalay_media_files}"
    volumes:
      - app-storage:/var/www/html/storage
      - /srv/media/projects/karyalayportal/uploads:/var/www/html/storage/app/media/uploads
    depends_on:
      app:
        condition: service_healthy



  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-karyalay}"
      MARIADB_USER: "${DB_USERNAME:-karyalay}"
      MARIADB_PASSWORD: "${SERVICE_PASSWORD_64_DATABASE}"
      # Separate Coolify-generated 64-character MariaDB root password.
      MARIADB_ROOT_PASSWORD: "${SERVICE_PASSWORD_64_DBROOT}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-storage:
  db-data:
  meili-data:
