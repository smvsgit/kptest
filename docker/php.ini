; Production PHP settings for Karyalay Portal
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 80M
max_execution_time = 300
max_input_time = 300
expose_php = Off

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
